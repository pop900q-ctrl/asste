<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Desk - Submit a Ticket</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .header {
            background: #2563eb;
            color: #ffffff;
            padding: 30px 25px;
            text-align: center;
        }

        .header img.logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #bfdbfe;
        }

        .form-body {
            padding: 30px 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Success Message Box */
        .success-message {
            display: none;
            background-color: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://globalits.co.uk/wp-content/uploads/2024/11/54.png" alt="IT Logo" class="logo">
        <h1>IT Helpdesk Support</h1>
        <p>Please fill in the details below to submit your issue</p>
    </div>

    <form class="form-body" id="ticketForm">
        
        <!-- Email Input with Restriction -->
        <div class="form-group">
            <label for="email">Work Email</label>
            <input type="email" 
                   id="email" 
                   name="email" 
                   placeholder="username@majd.sa" 
                   required
                   pattern=".+@majd\.sa"
                   title="Please use your @majd.sa work email address.">
        </div>

        <!-- Category & Priority Row -->
        <div class="row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select area</option>
                    <option value="Hardware">Hardware / PC</option>
                    <option value="Software">Software / Apps</option>
                    <option value="Network">Network / Wi-Fi</option>
                    <option value="Access">Access & Passwords</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High (Urgent)</option>
                </select>
            </div>
        </div>

        <!-- Issue Description -->
        <div class="form-group">
            <label for="description">Issue Description</label>
            <textarea id="description" name="description" placeholder="Describe the error or request in detail..." required></textarea>
        </div>

        <!-- File Attachment (Optional) -->
        <div class="form-group">
            <label for="attachment">Attachment (Screenshot/Log - Optional)</label>
            <input type="file" id="attachment" name="attachment" accept="image/*,.pdf,.doc,.docx">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submitBtn">Submit Ticket</button>

        <!-- Confirmation Alert -->
        <div class="success-message" id="successMessage">
            ✅ Ticket submitted successfully! Our IT team will get back to you shortly.
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('ticketForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // رابط n8n الخاص بك تم وضعه هنا مباشرة
        const N8N_WEBHOOK_URL = 'https://husmajd11.app.n8n.cloud/webhook/it-support-ticket';

        submitBtn.disabled = true;
        submitBtn.innerText = 'Sending...';

        const formData = {
            email: document.getElementById('email').value,
            category: document.getElementById('category').value,
            priority: document.getElementById('priority').value,
            description: document.getElementById('description').value,
            submittedAt: new Date().toISOString()
        };

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                successMessage.style.display = 'block';
                form.reset();
            } else {
                alert('An error occurred while submitting the ticket. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Could not connect to the n8n server.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Ticket';
        }
    });
</script>

</body>
</html>
